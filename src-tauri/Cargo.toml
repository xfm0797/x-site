[package]
name = "x-site"
version = "0.1.3"
description = "Cross-platform static blog desktop client"
authors = ["XFM"]
edition = "2026"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "x_site_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心：仅启用必要特性，关闭 devtools / http 重客户端等以减小体积
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite bundled SQLite 避免依赖系统库，体积可控
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
thiserror = "1"
# 静态站点生成
tera = "1"
pulldown-cmark = "0.10"
# syntect 仅启用 default-fancy 主题集合，避免打包全部主题（可显著减小体积）
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rayon = "1"
toml = "0.8"
once_cell = "1"
# 主题管理 + 本地预览
zip = "0.6"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
# 远程平台部署（Netlify/Vercel REST API 上传静态站点文件）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2 = "1.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# 优化等级 3：最激进的优化
opt-level = 3
# 链接时优化：跨 crate 内联 + 死代码消除，显著减小体积
lto = true
# 单代码生成单元：最大化 LTO 效果（编译更慢但体积最小）
codegen-units = 1
# 崩溃直接 abort，移除 unwinding 表（每个 panic 点不再生成展开代码）
panic = "abort"
# 剥离调试符号：减小二进制体积
strip = true

# dev profile 也适当优化（编译速度优先，启动速度可接受）
[profile.dev]
opt-level = 0
